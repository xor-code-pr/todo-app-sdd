name: CI

# NOTE: this workflow is dormant until the repository has a GitHub remote.
# Every gate below is runnable by hand — see specs/001-todo-core/quickstart.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-latest

    # Deliberately ONE job running steps in sequence rather than parallel jobs.
    # The constitution requires fast checks first and that "a failure at any
    # stage halts the pipeline; later stages do not run against a known-broken
    # build." Sequential steps give that for free; parallel jobs would run E2E
    # against code that already failed type checking.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      # ---- Gate 1: lint -------------------------------------------------
      - name: Ruff
        working-directory: backend
        run: ruff check .

      - name: ESLint (jsx-a11y at error)
        working-directory: frontend
        run: npm run lint

      # ---- Gate 2: types ------------------------------------------------
      - name: mypy --strict
        working-directory: backend
        run: mypy --strict src/

      - name: tsc --noEmit
        working-directory: frontend
        run: npm run typecheck

      # ---- Gate 3: unit -------------------------------------------------
      # Coverage is measured on the service tests alone. Running the whole
      # suite would inflate it with coverage incidentally produced by contract
      # tests, which is not what "coverage on domain logic" means.
      - name: pytest (services, >=80% coverage)
        working-directory: backend
        run: pytest tests/unit --cov=taskflow --cov-report=term-missing

      - name: Vitest
        working-directory: frontend
        run: npm test

      # ---- Gate 4: contract ---------------------------------------------
      - name: pytest (contract)
        working-directory: backend
        run: pytest tests/contract

      # ---- Gate 5: generated client drift -------------------------------
      # A schema change that breaks the generated client must fail CI rather
      # than surface at runtime (constitution, Principle IV).
      - name: Regenerate API client
        working-directory: frontend
        run: npm run generate:api

      - name: Fail on schema drift
        run: git diff --exit-code -- frontend/src/api/

      # ---- Gate 6: E2E + accessibility ----------------------------------
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E + axe
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
